# Keyless model and isolated-path patch over the headless profile with the
# SearXNG optional bundle enabled.
- id: headless-startup
  disabled: true

- id: headless-runner
  disabled: true

- id: llm-deepseek
  disabled: true

- id: agent-loop
  config:
    agents:
      - id: main
        provider: searxng-mock
        model: searxng-mock
        cwd: !!js process.cwd()

- id: shell-env
  config:
    dshHome: './.dsh-home'

- id: agent-instructions
  disabled: true

- id: skill-filesystem
  config:
    dshHome: './.dsh-home'
    agentsHome: './.agents-home'

- id: session-persistence-jsonl
  config:
    root: './.sessions'

- insert:
    - id: searxng-mock-llm
      name: './searxng-mock-llm.ts'
    - id: searxng-fixture-server
      name: './searxng-fixture-server.ts'
